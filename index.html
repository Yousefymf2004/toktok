<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشوارك - دليل كباتن التوك توك والتوصيل</title>
    <!-- تحميل خط Cairo العربي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- تحميل مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تحميل أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        /* إخفاء شريط التمرير الأفقي للفلاتر */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
        }
        .status-pulse {
            animation: pulse-dot 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- الشريط العلوي -->
    <header class="bg-gradient-to-l from-amber-500 via-amber-500 to-yellow-500 text-slate-950 shadow-md sticky top-0 z-30">
        <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-slate-950 text-amber-400 rounded-2xl flex items-center justify-center shadow-inner text-xl">
                    <i class="fa-solid fa-taxi"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight leading-none">مشوارك</h1>
                    <p class="text-xs font-bold text-slate-900/80 mt-1">كلم الكابتن مباشرة بدون وسيط</p>
                </div>
            </div>
            
            <!-- زر تسجيل كابتن جديد -->
            <button onclick="openModal('registerModal')" class="bg-slate-950 hover:bg-slate-800 active:scale-95 transition text-amber-400 text-xs sm:text-sm font-bold px-3.5 py-2.5 rounded-xl shadow flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i>
                <span>سجّل ككابتن</span>
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-2xl w-full mx-auto px-4 pt-4 pb-24">
        
        <!-- مربع البحث والفلترة -->
        <section class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 mb-4">
            <div class="relative mb-3">
                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input 
                    type="text" 
                    id="searchInput" 
                    oninput="filterDrivers()"
                    placeholder="ابحث باسم الكابتن أو البلد (مثلاً: المناصافور، ديرب نجم...)" 
                    class="w-full bg-slate-100/80 border border-slate-200 focus:border-amber-500 focus:bg-white focus:outline-none rounded-xl py-2.5 pr-10 pl-4 text-sm font-semibold transition"
                >
            </div>

            <!-- أزرار المناطق وزر المتاحين فقط -->
            <div class="flex items-center justify-between gap-2">
                <div id="areaFilters" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 flex-1">
                    <!-- يتم توليد أزرار البلاد تلقائياً -->
                </div>

                <button 
                    id="onlineOnlyBtn" 
                    onclick="toggleOnlineOnly()"
                    class="shrink-0 text-xs font-bold px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition flex items-center gap-1.5"
                >
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>المتاحين فقط</span>
                </button>
            </div>
        </section>

        <!-- شريط العدد -->
        <div class="flex items-center justify-between px-1 mb-3 text-xs font-bold text-slate-500">
            <span id="driversCountText">جاري تحميل الكباتن...</span>
            <span class="text-emerald-600 flex items-center gap-1">
                <i class="fa-solid fa-bolt"></i> اتصال أو واتساب بضغطة واحدة
            </span>
        </div>

        <!-- قائمة بطاقات الكباتن -->
        <div id="driversList" class="space-y-3"></div>

        <!-- رسالة في حالة عدم وجود نتائج -->
        <div id="emptyState" class="hidden text-center py-12 bg-white rounded-2xl border border-slate-200/80 mt-2">
            <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fa-solid fa-user-slash"></i>
            </div>
            <h3 class="font-extrabold text-slate-800 text-base">لا يوجد كباتن مسجلين حالياً</h3>
            <p class="text-xs text-slate-500 mt-1 mb-4">كن أول كابتن يسجل بياناته أو امسح الفلاتر</p>
            <div class="flex items-center justify-center gap-2">
                <button onclick="openModal('registerModal')" class="bg-slate-900 text-amber-400 font-bold text-xs px-4 py-2 rounded-xl shadow-sm">
                    سجّل ككابتن الآن
                </button>
                <button onclick="resetFilters()" class="bg-amber-500 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl shadow-sm">
                    عرض الكل
                </button>
            </div>
        </div>

    </main>

    <!-- نافذة إضافة كابتن جديد -->
    <div id="registerModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl transform transition-all max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <span class="w-8 h-8 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center">
                        <i class="fa-solid fa-id-card"></i>
                    </span>
                    <h2 class="font-black text-lg text-slate-900">أضف بياناتك ككابتن</h2>
                </div>
                <button onclick="closeModal('registerModal')" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="driverForm" onsubmit="handleAddDriver(event)" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1">اسم الكابتن / الشهرة *</label>
                    <input type="text" id="newDriverName" required placeholder="مثال: الأسطى يوسف محمد" class="w-full bg-slate-50 border border-slate-200 focus:border-amber-500 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm font-semibold outline-none">
                </div>

                <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1">الكابتن منين؟ (البلد / القرية / الموقف) *</label>
                    <input type="text" id="newDriverLocation" required placeholder="مثال: المناصافور - موقف ديرب نجم" class="w-full bg-slate-50 border border-slate-200 focus:border-amber-500 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm font-semibold outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs font-extrabold text-slate-700 mb-1">رقم الموبايل / واتساب *</label>
                        <input type="tel" id="newDriverPhone" required placeholder="010xxxxxxxx" pattern="[0-9]{11}" class="w-full bg-slate-50 border border-slate-200 focus:border-amber-500 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm font-semibold outline-none text-left" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold text-slate-700 mb-1">نوع المركبة *</label>
                        <select id="newDriverVehicle" class="w-full bg-slate-50 border border-slate-200 focus:border-amber-500 focus:bg-white rounded-xl px-3 py-2.5 text-sm font-bold outline-none">
                            <option value="توك توك">توك توك</option>
                            <option value="تمناية (سوزوكي)">تمناية (سوزوكي)</option>
                            <option value="ملاكي">ملاكي</option>
                            <option value="موتوسيكل">موتوسيكل</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1">ملاحظة إضافية (اختياري)</label>
                    <input type="text" id="newDriverNote" placeholder="مثال: متاح 24 ساعة - توصيل مشاوير خاصة وطلبات" class="w-full bg-slate-50 border border-slate-200 focus:border-amber-500 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm font-semibold outline-none">
                </div>

                <button type="submit" id="submitDriverBtn" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-slate-950 font-black py-3 rounded-xl shadow-md transition mt-2 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check-circle"></i>
                    <span>نشر اسمي في القائمة للجميع</span>
                </button>
            </form>
        </div>
    </div>

    <!-- إشعار التنبيه -->
    <div id="toastBox" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl z-50 hidden items-center gap-2 transition-all">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toastMessage">تم الحفظ بنجاح</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // إعدادات الربط بقاعدة البيانات السحابية
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'toktok-ymf-app';
        // ضع بيانات مشروعك هنا إذا كنت سترفع الملف خارج هذه المنصة على GitHub Pages
        const defaultFirebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;

        let db = null;
        let auth = null;
        let currentUser = null;
        let drivers = [];
        let selectedArea = 'الكل';
        let onlineOnly = false;

        // تهيئة الاتصال والمصادقة ثم الاستماع الفوري للبيانات
        async function initDatabase() {
            try {
                if (!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY") {
                    document.getElementById('driversCountText').textContent = 'يرجى إضافة إعدادات قاعدة البيانات في الكود';
                    renderAreaFilters();
                    filterDrivers();
                    return;
                }

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = cred.user;
                } else {
                    const cred = await signInAnonymously(auth);
                    currentUser = cred.user;
                }

                if (!currentUser) return;

                // جلب قائمة الكباتن العامة في الوقت الفعلي لتظهر عند الجميع
                const driversCol = collection(db, 'artifacts', appId, 'public', 'data', 'drivers');
                onSnapshot(driversCol, (snapshot) => {
                    drivers = snapshot.docs.map(docSnap => ({
                        id: docSnap.id,
                        ...docSnap.data()
                    }));
                    // ترتيب الأحدث أولاً في الذاكرة
                    drivers.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    renderAreaFilters();
                    filterDrivers();
                }, (error) => {
                    console.error("خطأ في جلب الكباتن:", error);
                    showToast('تعذر الاتصال بقاعدة البيانات حالياً');
                });

            } catch (error) {
                console.error("خطأ في تهيئة قاعدة البيانات:", error);
                document.getElementById('driversCountText').textContent = 'تعذر الاتصال بالسيرفر';
            }
        }

        function renderAreaFilters() {
            const container = document.getElementById('areaFilters');
            const areas = ['الكل', ...new Set(drivers.map(d => d.areaTag || (d.location ? d.location.split('-')[0].trim() : '')).filter(Boolean))];
            
            container.innerHTML = areas.map(area => {
                const isActive = selectedArea === area;
                return `
                    <button 
                        onclick="selectArea('${area}')"
                        class="shrink-0 text-xs font-bold px-3.5 py-2 rounded-xl transition ${
                            isActive 
                            ? 'bg-slate-900 text-amber-400 shadow-xs' 
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }"
                    >
                        ${area}
                    </button>
                `;
            }).join('');
        }

        window.selectArea = function(area) {
            selectedArea = area;
            renderAreaFilters();
            filterDrivers();
        };

        window.toggleOnlineOnly = function() {
            onlineOnly = !onlineOnly;
            const btn = document.getElementById('onlineOnlyBtn');
            if (onlineOnly) {
                btn.classList.remove('bg-slate-50', 'text-slate-700', 'border-slate-200');
                btn.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-300');
            } else {
                btn.classList.add('bg-slate-50', 'text-slate-700', 'border-slate-200');
                btn.classList.remove('bg-emerald-50', 'text-emerald-700', 'border-emerald-300');
            }
            filterDrivers();
        };

        window.resetFilters = function() {
            document.getElementById('searchInput').value = '';
            selectedArea = 'الكل';
            onlineOnly = false;
            const btn = document.getElementById('onlineOnlyBtn');
            btn.classList.add('bg-slate-50', 'text-slate-700', 'border-slate-200');
            btn.classList.remove('bg-emerald-50', 'text-emerald-700', 'border-emerald-300');
            renderAreaFilters();
            filterDrivers();
        };

        window.toggleDriverStatus = async function(id, currentStatus) {
            if (!currentUser || !db) {
                showToast('غير متصل بقاعدة البيانات');
                return;
            }
            try {
                const driverRef = doc(db, 'artifacts', appId, 'public', 'data', 'drivers', id);
                await updateDoc(driverRef, {
                    online: !currentStatus
                });
                showToast('تم تحديث الحالة للجميع');
            } catch (e) {
                console.error("خطأ في تحديث الحالة:", e);
                showToast('حدث خطأ أثناء التحديث');
            }
        };

        window.filterDrivers = function() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            
            const filtered = drivers.filter(driver => {
                const area = driver.areaTag || (driver.location ? driver.location.split('-')[0].trim() : '');
                const matchesArea = selectedArea === 'الكل' || area === selectedArea || (driver.location && driver.location.includes(selectedArea));
                const matchesOnline = !onlineOnly || driver.online;
                const matchesQuery = !query || 
                    (driver.name && driver.name.toLowerCase().includes(query)) || 
                    (driver.location && driver.location.toLowerCase().includes(query)) ||
                    (driver.vehicle && driver.vehicle.toLowerCase().includes(query));
                
                return matchesArea && matchesOnline && matchesQuery;
            });

            // ترتيب المتاحين أولاً
            filtered.sort((a, b) => (b.online === a.online) ? 0 : b.online ? 1 : -1);
            renderDriversList(filtered);
        };

        function renderDriversList(list) {
            const container = document.getElementById('driversList');
            const emptyState = document.getElementById('emptyState');
            const countText = document.getElementById('driversCountText');

            countText.textContent = `عدد الكباتن المسجلين: ${list.length}`;

            if (list.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            container.innerHTML = list.map(driver => {
                const cleanPhone = (driver.phone || '').replace(/\D/g, '');
                const waPhone = cleanPhone.startsWith('0') ? '2' + cleanPhone : cleanPhone;
                const waText = encodeURIComponent(`السلام عليكم يا ${driver.name}، جايلك من تطبيق مشوارك ومحتاج مشوار.`);

                return `
                    <article class="bg-white rounded-2xl p-4 shadow-xs border ${driver.online ? 'border-slate-200/90' : 'border-slate-200/50 opacity-85'} transition hover:shadow-md">
                        <div class="flex items-start justify-between gap-2 mb-2.5">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-2xl ${driver.online ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'} flex items-center justify-center text-xl font-black shrink-0">
                                    <i class="fa-solid ${driver.vehicle && (driver.vehicle.includes('تمناية') || driver.vehicle.includes('ملاكي')) ? 'fa-car-side' : 'fa-motorcycle'}"></i>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <h2 class="font-black text-base text-slate-900">${driver.name}</h2>
                                        <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-lg bg-slate-100 text-slate-700">
                                            ${driver.vehicle || 'توك توك'}
                                        </span>
                                    </div>
                                    
                                    <!-- بلد الكابتن -->
                                    <div class="inline-flex items-center gap-1.5 mt-1.5 bg-amber-50 border border-amber-200/80 text-amber-900 px-2.5 py-1 rounded-lg text-xs font-extrabold">
                                        <i class="fa-solid fa-location-dot text-amber-600"></i>
                                        <span>من: ${driver.location}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- الحالة -->
                            <button 
                                onclick="toggleDriverStatus('${driver.id}', ${Boolean(driver.online)})" 
                                title="اضغط لتغيير الحالة"
                                class="shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-extrabold border transition ${
                                    driver.online 
                                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                                    : 'bg-slate-100 text-slate-500 border-slate-200'
                                }"
                            >
                                <span class="w-2 h-2 rounded-full ${driver.online ? 'bg-emerald-500 status-pulse' : 'bg-slate-400'}"></span>
                                <span>${driver.online ? 'متاح الآن' : 'مشغول'}</span>
                            </button>
                        </div>

                        ${driver.note ? `
                            <p class="text-xs text-slate-600 bg-slate-50 rounded-xl px-3 py-2 mb-3 font-medium border border-slate-100">
                                <i class="fa-solid fa-circle-info text-slate-400 ml-1"></i>
                                ${driver.note}
                            </p>
                        ` : ''}

                        <!-- أزرار التواصل المباشر -->
                        <div class="grid grid-cols-2 gap-2.5 pt-1">
                            <a 
                                href="tel:${cleanPhone}" 
                                class="flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white font-extrabold text-sm py-3 rounded-xl shadow-xs transition"
                            >
                                <i class="fa-solid fa-phone text-amber-400"></i>
                                <span>اتصال مباشر</span>
                            </a>

                            <a 
                                href="https://wa.me/${waPhone}?text=${waText}" 
                                target="_blank"
                                rel="noopener noreferrer"
                                class="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-extrabold text-sm py-3 rounded-xl shadow-xs transition"
                            >
                                <i class="fa-brands fa-whatsapp text-lg"></i>
                                <span>واتساب</span>
                            </a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        window.handleAddDriver = async function(event) {
            event.preventDefault();
            
            if (!currentUser || !db) {
                showToast('تأكد من إعدادات قاعدة البيانات أولاً');
                return;
            }

            const name = document.getElementById('newDriverName').value.trim();
            const location = document.getElementById('newDriverLocation').value.trim();
            const phone = document.getElementById('newDriverPhone').value.trim();
            const vehicle = document.getElementById('newDriverVehicle').value;
            const note = document.getElementById('newDriverNote').value.trim();

            if (!name || !location || !phone) return;

            const btn = document.getElementById('submitDriverBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري النشر...</span>';

            try {
                const areaTag = location.split('-')[0].trim();
                const driversCol = collection(db, 'artifacts', appId, 'public', 'data', 'drivers');
                
                await addDoc(driversCol, {
                    name,
                    location,
                    areaTag,
                    phone,
                    vehicle,
                    note,
                    online: true,
                    createdBy: currentUser.uid,
                    createdAt: Date.now()
                });

                document.getElementById('driverForm').reset();
                closeModal('registerModal');
                showToast('تم نشر بياناتك في القائمة للجميع!');
            } catch (e) {
                console.error("خطأ في إضافة الكابتن:", e);
                showToast('حدث خطأ أثناء الحفظ، حاول مرة أخرى');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> <span>نشر اسمي في القائمة للجميع</span>';
            }
        };

        window.openModal = function(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeModal = function(id) {
            const modal = document.getElementById(id);
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMessage').textContent = msg;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 2800);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDatabase();
        });
    </script>
</body>
</html>
