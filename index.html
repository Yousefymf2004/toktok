<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشوارك - كابتن التوصيل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
        }
        .status-pulse {
            animation: pulse-dot 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- الشريط العلوي -->
    <header class="bg-gradient-to-l from-amber-500 via-amber-500 to-yellow-500 text-slate-950 shadow-md sticky top-0 z-30">
        <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-slate-950 text-amber-400 rounded-2xl flex items-center justify-center shadow-inner text-xl">
                    <i class="fa-solid fa-taxi"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight leading-none">مشوارك</h1>
                    <p class="text-xs font-bold text-slate-900/80 mt-1">تواصل مباشر مع الكابتن</p>
                </div>
            </div>
            
            <button onclick="openModal('registerModal')" class="bg-slate-950 hover:bg-slate-800 active:scale-95 transition text-amber-400 text-xs sm:text-sm font-bold px-3.5 py-2.5 rounded-xl shadow flex items-center gap-1.5">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>تعديل الكابتن</span>
            </button>
        </div>
    </header>

    <!-- شريط حالة الربط السحابي -->
    <div id="cloudStatusBanner" class="max-w-2xl w-full mx-auto px-4 pt-3">
        <div id="cloudStatusBox" class="bg-amber-50 border border-amber-200 text-amber-900 rounded-2xl px-3.5 py-2.5 text-xs font-bold flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span id="cloudStatusDot" class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                <span id="cloudStatusText">جاري الاتصال بقاعدة البيانات...</span>
            </div>
            <span id="cloudModeBadge" class="text-[11px] px-2 py-0.5 rounded-lg bg-white/80 border border-amber-200/70">جاري الفحص</span>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-2xl w-full mx-auto px-4 pt-3 pb-24">
        <div id="driverCardContainer"></div>

        <div id="emptyState" class="hidden bg-white rounded-3xl p-8 text-center border border-slate-200/80 shadow-xs mt-4">
            <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-2xl mx-auto mb-3">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="font-black text-base text-slate-900 mb-1">لا توجد بيانات كابتن مسجلة بعد</h2>
            <p class="text-xs text-slate-500 font-semibold mb-4">اضغط على زر تعديل الكابتن لإضافة بيانات الكابتن وحفظها على قاعدة البيانات.</p>
            <button onclick="openModal('registerModal')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs sm:text-sm px-5 py-3 rounded-xl shadow transition inline-flex items-center gap-2">
                <i class="fa-solid fa-plus"></i>
                <span>إضافة بيانات الكابتن</span>
            </button>
        </div>
    </main>

    <!-- نافذة إعداد / تعديل بيانات الكابتن -->
    <div id="registerModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl transform transition-all max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <span class="w-8 h-8 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center">
                        <i class="fa-solid fa-id-card"></i>
                    </span>
                    <h2 class="font-black text-lg text-slate-900">بيانات الكابتن</h2>
                </div>
                <button onclick="closeModal('registerModal')" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="driverForm" onsubmit="handleSaveDriver(event)" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1">اسم الكابتن / الشهرة *</label>
                    <input type="text" id="newDriverName" required placeholder="مثال: يوسف رسلان" class="w-full bg-slate-50 border border-slate-200 focus:border-amber-500 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm font-semibold outline-none">
                </div>

                <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1">الكابتن منين؟ (البلد / القرية / الموقف) *</label>
                    <input type="text" id="newDriverLocation" required placeholder="مثال: المناصافور - موقف ديرب نجم" class="w-full bg-slate-50 border border-slate-200 focus:border-amber-500 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm font-semibold outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs font-extrabold text-slate-700 mb-1">رقم الموبايل / واتساب *</label>
                        <input type="tel" id="newDriverPhone" required placeholder="010xxxxxxxx" pattern="[0-9]{10,15}" class="w-full bg-slate-50 border border-slate-200 focus:border-amber-500 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm font-semibold outline-none text-left" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold text-slate-700 mb-1">نوع المركبة *</label>
                        <select id="newDriverVehicle" class="w-full bg-slate-50 border border-slate-200 focus:border-amber-500 focus:bg-white rounded-xl px-3 py-2.5 text-sm font-bold outline-none">
                            <option value="توك توك">توك توك</option>
                            <option value="تمناية (سوزوكي)">تمناية (سوزوكي)</option>
                            <option value="ملاكي">ملاكي</option>
                            <option value="موتوسيكل">موتوسيكل</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1">ملاحظة إضافية (اختياري)</label>
                    <input type="text" id="newDriverNote" placeholder="مثال: متاح 24 ساعة - توصيل مشاوير خاصة" class="w-full bg-slate-50 border border-slate-200 focus:border-amber-500 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm font-semibold outline-none">
                </div>

                <button type="submit" id="submitDriverBtn" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-slate-950 font-black py-3.5 rounded-xl shadow-md transition mt-3 flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>حفظ بيانات الكابتن</span>
                </button>
            </form>
        </div>
    </div>

    <!-- إشعار التنبيه -->
    <div id="toastBox" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl z-50 hidden items-center gap-2 transition-all">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toastMessage">تم الحفظ بنجاح</span>
    </div>

    <script>
        const DATABASE_URL = 'https://mishwark-4dfba-default-rtdb.firebaseio.com';
        const DRIVER_ENDPOINT = `${DATABASE_URL}/main_captain.json`;
        const LOCAL_STORAGE_KEY = 'mashwarak_single_driver_v1';

        let singleDriver = null;
        let pollTimer = null;

        function setCloudStatus(state, message) {
            const box = document.getElementById('cloudStatusBox');
            const dot = document.getElementById('cloudStatusDot');
            const text = document.getElementById('cloudStatusText');
            const badge = document.getElementById('cloudModeBadge');

            if (!box || !dot || !text || !badge) return;

            text.textContent = message;

            if (state === 'connected') {
                box.className = 'bg-emerald-50 border border-emerald-200 text-emerald-900 rounded-2xl px-3.5 py-2.5 text-xs font-bold flex items-center justify-between gap-2';
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 status-pulse';
                badge.className = 'text-[11px] px-2 py-0.5 rounded-lg bg-white text-emerald-700 border border-emerald-200';
                badge.textContent = 'متصل مباشر';
            } else if (state === 'error') {
                box.className = 'bg-rose-50 border border-rose-200 text-rose-900 rounded-2xl px-3.5 py-2.5 text-xs font-bold flex items-center justify-between gap-2';
                dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
                badge.className = 'text-[11px] px-2 py-0.5 rounded-lg bg-white text-rose-700 border border-rose-200';
                badge.textContent = 'تنبيه قاعدة البيانات';
            } else {
                box.className = 'bg-amber-50 border border-amber-200 text-amber-900 rounded-2xl px-3.5 py-2.5 text-xs font-bold flex items-center justify-between gap-2';
                dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500';
                badge.className = 'text-[11px] px-2 py-0.5 rounded-lg bg-white text-amber-800 border border-amber-200';
                badge.textContent = 'جاري المزامنة';
            }
        }

        function saveLocalDriver(driver) {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(driver));
            } catch (_) {}
        }

        function loadLocalDriver() {
            try {
                const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (_) {
                return null;
            }
        }

        function fillFormWithDriver(driver) {
            if (!driver) return;
            document.getElementById('newDriverName').value = driver.name || '';
            document.getElementById('newDriverLocation').value = driver.location || '';
            document.getElementById('newDriverPhone').value = driver.phone || '';
            document.getElementById('newDriverVehicle').value = driver.vehicle || 'توك توك';
            document.getElementById('newDriverNote').value = driver.note || '';
        }

        async function fetchDriverFromDatabase(isInitial = false) {
            try {
                const response = await fetch(DRIVER_ENDPOINT, { cache: 'no-store' });
                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        setCloudStatus('error', 'قواعد Realtime Database تمنع القراءة — اجعل القراءة مفتوحة (.read: true)');
                    } else {
                        setCloudStatus('error', `تعذر الوصول لقاعدة البيانات (${response.status})`);
                    }
                    return;
                }

                const data = await response.json();
                setCloudStatus('connected', 'متصل بقاعدة البيانات — بيانات الكابتن تظهر في أي تليفون');

                if (data && data.name && data.phone) {
                    singleDriver = data;
                    saveLocalDriver(data);
                    fillFormWithDriver(data);
                    renderSingleDriver(data);
                } else if (isInitial && singleDriver && singleDriver.name && singleDriver.phone) {
                    await pushDriverToDatabase(singleDriver);
                } else if (!data) {
                    singleDriver = null;
                    renderSingleDriver(null);
                }
            } catch (err) {
                console.error('Database fetch error:', err);
                setCloudStatus('error', 'تعذر الاتصال بالإنترنت أو بقاعدة البيانات');
            }
        }

        async function pushDriverToDatabase(driverData) {
            const response = await fetch(DRIVER_ENDPOINT, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(driverData)
            });

            if (!response.ok) {
                if (response.status === 401 || response.status === 403) {
                    setCloudStatus('error', 'قواعد Realtime Database تمنع الكتابة — اجعل الكتابة متاحة (.write: true)');
                }
                throw new Error(`HTTP ${response.status}`);
            }

            setCloudStatus('connected', 'متصل بقاعدة البيانات — بيانات الكابتن تظهر في أي تليفون');
            return await response.json();
        }

        function startLiveStream() {
            fetchDriverFromDatabase(true);

            try {
                const eventSource = new EventSource(DRIVER_ENDPOINT);
                eventSource.addEventListener('put', (event) => {
                    try {
                        const payload = JSON.parse(event.data);
                        const nextData = payload ? payload.data : null;
                        setCloudStatus('connected', 'متصل بقاعدة البيانات — تحديث لحظي لجميع الأجهزة');

                        if (nextData && nextData.name && nextData.phone) {
                            singleDriver = nextData;
                            saveLocalDriver(nextData);
                            fillFormWithDriver(nextData);
                            renderSingleDriver(nextData);
                        } else if (nextData === null) {
                            singleDriver = null;
                            renderSingleDriver(null);
                        }
                    } catch (_) {}
                });
                eventSource.addEventListener('patch', () => {
                    fetchDriverFromDatabase(false);
                });
                eventSource.onerror = () => {
                    // يعتمد على المزامنة الدورية في حال انقطاع البث المباشر مؤقتاً
                };
            } catch (_) {}

            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(() => {
                fetchDriverFromDatabase(false);
            }, 6000);
        }

        window.toggleDriverStatus = async function(currentStatus) {
            if (!singleDriver) return;
            const nextStatus = !currentStatus;
            const updated = { ...singleDriver, online: nextStatus, updatedAt: Date.now() };
            singleDriver = updated;
            saveLocalDriver(updated);
            renderSingleDriver(updated);

            try {
                await pushDriverToDatabase(updated);
                showToast('تم تحديث الحالة على قاعدة البيانات');
            } catch (err) {
                console.error('Status update error:', err);
                showToast('تم التحديث محلياً — تحقق من قواعد قاعدة البيانات');
            }
        };

        function renderSingleDriver(driver) {
            const container = document.getElementById('driverCardContainer');
            const emptyState = document.getElementById('emptyState');

            if (!driver || !driver.name || !driver.phone) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            const cleanPhone = (driver.phone || '').replace(/\D/g, '');
            const waPhone = cleanPhone.startsWith('0') ? '2' + cleanPhone : cleanPhone;
            const waText = encodeURIComponent(`السلام عليكم يا ${driver.name}، جايلك من تطبيق مشوارك ومحتاج مشوار.`);
            const isOnline = driver.online !== false;

            container.innerHTML = `
                <article class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border ${isOnline ? 'border-slate-200/90' : 'border-slate-200/60 opacity-90'} transition">
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <div class="flex items-center gap-3.5">
                            <div class="w-14 h-14 rounded-2xl ${isOnline ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'} flex items-center justify-center text-2xl font-black shrink-0">
                                <i class="fa-solid ${driver.vehicle && (driver.vehicle.includes('تمناية') || driver.vehicle.includes('ملاكي')) ? 'fa-car-side' : 'fa-motorcycle'}"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h2 class="font-black text-lg sm:text-xl text-slate-900">${driver.name}</h2>
                                    <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-lg bg-slate-100 text-slate-700">
                                        ${driver.vehicle || 'توك توك'}
                                    </span>
                                </div>
                                
                                <div class="inline-flex items-center gap-1.5 mt-2 bg-amber-50 border border-amber-200/80 text-amber-900 px-3 py-1 rounded-xl text-xs sm:text-sm font-extrabold">
                                    <i class="fa-solid fa-location-dot text-amber-600"></i>
                                    <span>الكابتن من: ${driver.location || 'غير محدد'}</span>
                                </div>
                            </div>
                        </div>

                        <button 
                            onclick="toggleDriverStatus(${isOnline})" 
                            title="اضغط لتغيير الحالة"
                            class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-extrabold border transition ${
                                isOnline 
                                ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                                : 'bg-slate-100 text-slate-500 border-slate-200'
                            }"
                        >
                            <span class="w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-emerald-500 status-pulse' : 'bg-slate-400'}"></span>
                            <span>${isOnline ? 'متاح الآن' : 'مشغول'}</span>
                        </button>
                    </div>

                    ${driver.note ? `
                        <p class="text-xs sm:text-sm text-slate-600 bg-slate-50 rounded-2xl px-3.5 py-2.5 mb-4 font-semibold border border-slate-100">
                            <i class="fa-solid fa-circle-info text-amber-500 ml-1.5"></i>
                            ${driver.note}
                        </p>
                    ` : ''}

                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <a 
                            href="tel:${cleanPhone}" 
                            class="flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white font-extrabold text-sm sm:text-base py-3.5 rounded-2xl shadow-xs transition"
                        >
                            <i class="fa-solid fa-phone text-amber-400"></i>
                            <span>اتصال مباشر</span>
                        </a>

                        <a 
                            href="https://wa.me/${waPhone}?text=${waText}" 
                            target="_blank"
                            rel="noopener noreferrer"
                            class="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-extrabold text-sm sm:text-base py-3.5 rounded-2xl shadow-xs transition"
                        >
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                            <span>واتساب</span>
                        </a>
                    </div>
                </article>
            `;
        }

        window.handleSaveDriver = async function(event) {
            event.preventDefault();

            const name = document.getElementById('newDriverName').value.trim();
            const location = document.getElementById('newDriverLocation').value.trim();
            const phone = document.getElementById('newDriverPhone').value.trim();
            const vehicle = document.getElementById('newDriverVehicle').value;
            const note = document.getElementById('newDriverNote').value.trim();

            if (!name || !location || !phone) return;

            const btn = document.getElementById('submitDriverBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري الحفظ...</span>';

            const payload = {
                name,
                location,
                phone,
                vehicle,
                note,
                online: singleDriver ? singleDriver.online !== false : true,
                updatedAt: Date.now()
            };

            singleDriver = payload;
            saveLocalDriver(payload);
            renderSingleDriver(payload);

            let savedCloud = false;
            try {
                await pushDriverToDatabase(payload);
                savedCloud = true;
            } catch (err) {
                console.error('Save error:', err);
            }

            closeModal('registerModal');
            showToast(savedCloud ? 'تم حفظ الكابتن ويظهر الآن في أي تليفون' : 'تم الحفظ محلياً فقط');

            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> <span>حفظ بيانات الكابتن</span>';
        };

        window.openModal = function(id) {
            fillFormWithDriver(singleDriver);
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeModal = function(id) {
            const modal = document.getElementById(id);
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMessage').textContent = msg;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 2800);
        }

        window.addEventListener('DOMContentLoaded', () => {
            singleDriver = loadLocalDriver();
            fillFormWithDriver(singleDriver);
            renderSingleDriver(singleDriver);
            startLiveStream();
        });
    </script>
</body>
</html>
